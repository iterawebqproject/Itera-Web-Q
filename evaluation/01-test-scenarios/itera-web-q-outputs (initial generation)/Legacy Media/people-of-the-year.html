    <script>
        window.onscroll = function() {
  const header = document.querySelector('header');
  const progress = document.querySelector('.progress-bar');
  const scroll = document.documentElement.scrollTop;
  const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const scrolled = (scroll / height) * 100;
  
  if (scroll > 50) { header.classList.add('scrolled'); } else { header.classList.remove('scrolled'); }
  if (progress) { progress.style.width = scrolled + '%'; }
};

function sortTable(criteria) {
  const table = document.getElementById('olympicTable');
  if(!table) return;
  const rows = Array.from(table.rows).slice(1);
  rows.sort((a, b) => {
    const valA = parseInt(a.getAttribute('data-' + criteria));
    const valB = parseInt(b.getAttribute('data-' + criteria));
    return valB - valA;
  });
  rows.forEach(row => table.appendChild(row));
}
