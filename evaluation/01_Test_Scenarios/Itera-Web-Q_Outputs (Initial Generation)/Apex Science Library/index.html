<!DOCTYPE html>
<html lang="en">
<head>

    <title>Apex Science Library | Academic Excellence</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; }
        body > *:not(header):not(nav):not(footer):not(script):not(style) { flex: 1; }
        img { max-width: 100%; height: auto; }
        
        :root { --primary: #0093AF; --bg: #f8f9fa; --text: #333; --white: #ffffff; --border: #e0e0e0; --font-heading: 'Palatino', 'Palatino Linotype', serif; --font-body: 'Helvetica', Arial, sans-serif; } * { box-sizing: border-box; margin: 0; padding: 0; } body { font-family: var(--font-body); color: var(--text); background: var(--bg); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; } header { background: var(--white); border-bottom: 1px solid var(--border); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; } .logo { font-family: var(--font-heading); font-size: 1.5rem; font-weight: bold; color: var(--primary); text-decoration: none; } nav a { margin-left: 1.5rem; text-decoration: none; color: var(--text); font-size: 0.9rem; font-weight: 500; } nav a:hover, nav a.active { color: var(--primary); } main { flex: 1; } .layout-wrapper { display: flex; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; } aside { width: 280px; background: var(--white); border-right: 1px solid var(--border); padding: 2rem; position: sticky; top: 70px; height: calc(100vh - 70px); overflow-y: auto; } .content-area { flex: 1; padding: 2rem; background: var(--white); } .hero-search { background: var(--primary); padding: 4rem 5%; text-align: center; color: var(--white); } .hero-search h1 { font-family: var(--font-heading); font-size: 2.5rem; margin-bottom: 1.5rem; } .search-bar { max-width: 600px; margin: 0 auto; position: relative; } .search-bar input { width: 100%; padding: 1rem 1rem 1rem 3rem; border-radius: 4px; border: none; font-size: 1rem; } .search-bar svg { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); fill: #888; } .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; padding: 3rem 5%; } .pill-card { background: var(--white); border: 1px solid var(--border); padding: 1.5rem; border-radius: 50px; text-align: center; text-decoration: none; color: var(--text); transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 10px; } .pill-card:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-2px); } .pill-card svg { width: 24px; height: 24px; fill: var(--primary); } .support-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; padding: 3rem 5%; background: #f1f1f1; } .tile { background: var(--white); padding: 2rem; text-align: center; border-radius: 8px; } .btn-primary { background: var(--primary); color: var(--white); padding: 0.8rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; display: inline-block; font-weight: bold; } .sidebar-list { list-style: none; } .sidebar-list li { margin-bottom: 1rem; padding-left: 1rem; border-left: 3px solid transparent; cursor: pointer; } .sidebar-list li.active { border-left-color: var(--primary); font-weight: bold; color: var(--primary); } .resource-card { border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1rem; border-radius: 4px; display: flex; gap: 1.5rem; align-items: flex-start; } .resource-card h3 { font-family: var(--font-heading); color: var(--primary); margin-bottom: 0.5rem; } .course-header { background: var(--primary); color: var(--white); padding: 2rem; margin: -2rem -2rem 2rem -2rem; font-family: var(--font-heading); } .matrix-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; } .matrix-table th { background: var(--primary); color: var(--white); text-align: left; padding: 1rem; } .matrix-table td { padding: 1rem; border-bottom: 1px solid var(--border); } .reading-pane { font-size: 1.1rem; line-height: 1.8; max-width: 800px; } .feedback-widget { margin-top: 3rem; padding: 2rem; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 1rem; } .feedback-btn { background: none; border: 1px solid var(--border); padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 5px; } .feedback-btn.active { background: var(--primary); color: var(--white); border-color: var(--primary); } footer { background: #222; color: #ccc; padding: 2rem 5%; text-align: center; font-size: 0.85rem; } dialog { border: none; border-radius: 8px; padding: 0; width: 90%; max-width: 900px; height: 80vh; box-shadow: 0 10px 30px rgba(0,0,0,0.3); } dialog::backdrop { background: rgba(0,0,0,0.7); } .dialog-header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <script>
        function openPreview(title) { const dialog = document.getElementById('pdf-preview'); document.getElementById('preview-title').innerText = title; dialog.showModal(); } function closePreview() { document.getElementById('pdf-preview').close(); } function toggleFeedback(btn, type) { const btns = btn.parentElement.querySelectorAll('.feedback-btn'); btns.forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
