<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <meta name="description" content="Exploring identity through projects, words, and hobbies.">
    <title>Reading | Alice Life</title>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; display: flex; flex-direction: column; min-height: 100vh; }
        body > *:not(header):not(nav):not(footer):not(script):not(style) { flex: 1; }
        img { max-width: 100%; height: auto; }
        
        body { margin: 0; font-family: 'Trebuchet MS', sans-serif; background-color: #f8f9ff; color: #333; display: flex; flex-direction: column; min-height: 100vh; line-height: 1.6; }
header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
nav a { margin-left: 1.5rem; text-decoration: none; color: #333; font-weight: 600; font-size: 0.9rem; transition: color 0.3s; }
nav a:hover { color: #cacefb; }
.brand { font-size: 1.4rem; font-weight: bold; color: #333; text-decoration: none; }
main { flex: 1; padding: 2rem 5%; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
.hero-intro { text-align: center; margin-bottom: 3rem; }
.hero-intro h1 { font-size: 2.5rem; color: #333; margin-bottom: 0.5rem; }
.bento-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(180px, auto); gap: 1.5rem; }
.card { background: #fff; border: 1px solid #eee; border-radius: 16px; padding: 1.5rem; text-decoration: none; color: inherit; transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(202, 206, 251, 0.3); border-color: #cacefb; }
.card-large { grid-column: span 2; grid-row: span 2; }
.card-medium { grid-column: span 2; }
.card-small { grid-column: span 1; }
.card svg { width: 40px; height: 40px; margin-bottom: 1rem; color: #cacefb; }
.card h2 { margin: 0; font-size: 1.5rem; font-family: serif; }
.card p { font-size: 0.9rem; color: #666; margin-top: 0.5rem; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-top: 10px; }
.badge-reading { background: #fff4e6; color: #d97706; }
.badge-finished { background: #ecfdf5; color: #059669; }
.tech-stack { display: flex; gap: 8px; margin-top: 1rem; }
.tech-stack svg { width: 20px; height: 20px; margin: 0; }
footer { text-align: center; padding: 2rem; border-top: 1px solid #eee; font-size: 0.8rem; color: #999; }
@media (max-width: 900px) { .bento-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) { .bento-grid { grid-template-columns: 1fr; } .card-large, .card-medium { grid-column: span 1; } }
    </style>
</head>
<body>
    <header>
  <a href="index" class="brand">Alice Life</a>
  <nav>
    <a href="index">Home</a>
    <a href="projects">Projects</a>
    <a href="writing">Writing</a>
    <a href="reading">Reading</a>
    <a href="hobbies">Hobbies</a>
  </nav>
</header><main>
  <h1 style="margin-bottom: 2rem;">Reading List</h1>
  <div class="bento-grid">
    <div class="card card-small">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      <h2>Dune</h2>
      <p>Frank Herbert</p>
      <span class="badge badge-reading">Reading</span>
    </div>
    <div class="card card-small">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
      <h2>Atomic Habits</h2>
      <p>James Clear</p>
      <span class="badge badge-finished">Finished</span>
    </div>
  </div>
</main><footer>
  <p>© 2026 Alice Life. Built with passion and curiosity.</p>
</footer>

        console.log('Alice Life initialized');
    </script>
</body>
</html>
